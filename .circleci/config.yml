version: 2.1
workflows:
  version: 2
  build_and_test:
    jobs:
      - lint:
          filters:
            tags:
              only: /.*/
      - build_tag:
          requires:
            - lint
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
jobs:
  build_tag:
    docker:
      - image: cimg/python:3.14.5
    steps:
      - checkout
      - run:
          name: Install Ansible
          command: |
            pip install -U pip
            pip install ansible
      - run:
          name: Check tag matches galaxy.yml version
          command: |
            version="$(sed -n 's/^version: *//p' galaxy.yml)"
            if [ "$CIRCLE_TAG" != "$version" ]; then
              echo "Tag '$CIRCLE_TAG' does not match galaxy.yml version '$version'"
              exit 1
            fi
      - run:
          name: Ansible Build
          command: ansible-galaxy collection build
      - run:
          name: Ansible Publish
          command: >
            find . -type f -name murrple_1-rss_temple-*.tar.gz
            -exec ansible-galaxy collection publish --api-key $ANSIBLE_API_KEY {} \;

  lint:
    docker:
      - image: cimg/python:3.14.5
    steps:
      - checkout
      - run:
          name: Install Ansible-Lint
          command: |
            pip install -U pip
            pip install ansible-lint==25.9.0 ansible
      - run:
          name: Install required collections
          command: |
            ansible-galaxy collection install -r requirements.yml
      - run:
          name: ansible-lint lint
          command: ansible-lint . roles/ playbooks/
