---
- name: Setup `{{ item.name }}` temp file
  ansible.builtin.template:
    src: '{{ item.template }}'
    dest: '{{ item.dest }}.{{ ansible_facts["date_time"].iso8601_basic }}'
    mode: '{{ item.mode }}'

- name: Copy in `{{ item.name }}`
  ansible.builtin.copy:
    src: '{{ item.dest }}.{{ ansible_facts["date_time"].iso8601_basic }}'
    dest: '{{ item.dest }}'
    remote_src: true
    force: false
    mode: '{{ item.mode }}'

- name: Stat `{{ item.name }}` temp file
  ansible.builtin.stat:
    path: '{{ item.dest }}.{{ ansible_facts["date_time"].iso8601_basic }}'
    get_checksum: true
    get_mime: false
    get_attributes: false
  register: _common__temp_file_stat

- name: Stat `{{ item.name }}`
  ansible.builtin.stat:
    path: '{{ item.dest }}'
    get_checksum: true
    get_mime: false
    get_attributes: false
  register: _common__file_stat

- name: Remove `{{ item.name }}` temp file
  ansible.builtin.file:
    path: '{{ item.dest }}.{{ ansible_facts["date_time"].iso8601_basic }}'
    state: absent
  when: _common__temp_file_stat.stat.checksum == _common__file_stat.stat.checksum
