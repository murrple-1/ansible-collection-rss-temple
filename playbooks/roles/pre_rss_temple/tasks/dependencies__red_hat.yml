---
- ansible.builtin.set_fact:
    _pre_rss_temple__docker_variant: '{{ ansible_facts["distribution"] | lower }}'
  when: ansible_facts["distribution"] | lower not in ('rocky', 'oraclelinux')

- ansible.builtin.set_fact:
    _pre_rss_temple__docker_variant: rhel
  when: ansible_facts["distribution"] | lower in ('rocky', 'oraclelinux')

- name: Install `dnf-plugins-core` (so additional repos can be added)
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present
  become: true

- name: Add Docker's `dnf` repo
  ansible.builtin.command:
    argv:
      - dnf
      - config-manager
      - --add-repo
      - 'https://download.docker.com/linux/{{ _pre_rss_temple__docker_repo_distro_name }}/docker-ce.repo'
    creates: '/etc/yum/yum.repos.d/docker-ce.repo'
  become: true

- name: Remove conflicting packages which are occassionally installed by default
  become: true
  ansible.builtin.dnf:
    name:
      - podman
      - buildah
    state: absent

- name: Install dependencies via `dnf`
  become: true
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - python3-pip
      - git
    state: present
    update_cache: true

- name: Add `{{ ansible_user }}` to `docker` group
  when: pre_rss_temple__should_add_ansible_user_to_docker_group
  become: true
  ansible.builtin.user:
    name: '{{ ansible_user }}'
    append: true
    groups: docker

- name: Start Docker Service
  become: true
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
