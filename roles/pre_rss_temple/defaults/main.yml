---
# Remote directory path when the application is being installed
pre_rss_temple__opt_path: /opt/rss_temple/

# Group for `pre_rss_temple__opt_path`, used only when the Ansible user can't create that directory themselves
# (eg under `/opt`). Then this system group is created, the Ansible user is added to it, and the directory is
# created as `root:<this group>`, mode 2775. A directory the Ansible user can create (eg under their home
# directory) gets no special group. A directory that already exists is never changed.
pre_rss_temple__opt_group: rss_temple

# Remote directory path where the infra configuration is installed
pre_rss_temple__service_path: '{{ pre_rss_temple__opt_path }}/rss_temple_infra/'

# List of fully-qualified domains that should direct to the rss_temple server (or a comma-separated string of them).
# Must not be empty: the playbooks prompt for it
pre_rss_temple__server_domains: []

# List of fully-qualified domains that should direct to the rss_temple_web_app server (or a comma-separated string of them).
# Must not be empty: the playbooks prompt for it
pre_rss_temple__web_app_domains: []

# List of fully-qualified domains that should direct to the rss_temple_home server (or a comma-separated string of them).
# Must not be empty: the playbooks prompt for it
pre_rss_temple__home_domains: []

# Papertrail log destination (ie 'logsN.papertrailapp.com' and its port). If the host is empty, Papertrail logging is not set up
pre_rss_temple__papertrail_destination_host: ''
pre_rss_temple__papertrail_destination_port: ''

# When Papertrail is set up, containers log to journald with this tag (the container name), and rsyslog forwards
# them along with the rest of the host's logs. See https://docs.docker.com/engine/logging/drivers/journald/
pre_rss_temple__docker_log_tag: !unsafe '{{.Name}}'

# Should the Ansible user be added to the `docker` group (so docker commands can be run without `sudo`)
pre_rss_temple__should_add_ansible_user_to_docker_group: true

# The user to add to the `docker` group. Defaults to `ansible_user`, or the user Ansible connected as when that is
# unset (eg `--connection=local`)
pre_rss_temple__docker_group_user: "{{ ansible_user | default(ansible_facts['user_id']) }}"
