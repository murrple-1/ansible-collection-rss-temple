---
# Remote directory path when the application is being installed
pre_rss_temple__opt_path: /opt/rss_temple/

# Remote directory path where the infra configuration is installed
pre_rss_temple__service_path: '{{ pre_rss_temple__opt_path }}/rss_temple_infra/'

# list of fully-qualified domains that should direct to the rss_temple server
pre_rss_temple__server_domains: []

# list of fully-qualified domains that should direct to the rss_temple_web_app server
pre_rss_temple__web_app_domains: []

# list of fully-qualified domains that should direct to the rss_temple_home server
pre_rss_temple__home_domains: []

# Papertrail log destination (ie 'logsN.papertrailapp.com' and its port). If the host is empty, Papertrail logging is not set up
pre_rss_temple__papertrail_destination_host: ''
pre_rss_temple__papertrail_destination_port: ''

# Should the Ansible user be added to the `docker` group (so docker commands can be run without `sudo`)
pre_rss_temple__should_add_ansible_user_to_docker_group: true
