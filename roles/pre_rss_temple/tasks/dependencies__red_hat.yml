---
# Docker publishes repos for `centos`, `fedora` and `rhel`; RHEL rebuilds use the `rhel` one
- ansible.builtin.set_fact:
    _pre_rss_temple__docker_variant: >-
      {{ ansible_facts['distribution'] | lower if ansible_facts['distribution'] | lower in ('centos', 'fedora') else 'rhel' }}

# Download the `.repo` file directly: `dnf config-manager --add-repo` changed syntax in dnf5
- name: Add Docker's `dnf` repo
  ansible.builtin.get_url:
    url: 'https://download.docker.com/linux/{{ _pre_rss_temple__docker_variant }}/docker-ce.repo'
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: '0644'
  become: true

- name: Remove conflicting packages which are occassionally installed by default
  become: true
  ansible.builtin.dnf:
    name:
      - podman
      - buildah
    state: absent

- name: Install dependencies via `dnf`
  become: true
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - python3-pip
      - git
    state: present
    update_cache: true

- name: Add `{{ pre_rss_temple__docker_group_user }}` to `docker` group
  when: pre_rss_temple__should_add_ansible_user_to_docker_group | bool
  become: true
  ansible.builtin.user:
    name: '{{ pre_rss_temple__docker_group_user }}'
    append: true
    groups: docker

- name: Start Docker Service
  become: true
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
