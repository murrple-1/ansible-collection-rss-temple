---
- name: Install dependencies via `apt`
  become: true
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.apt:
    name:
      - rsyslog-gnutls
    state: present

- name: Install dependencies via `dnf`
  become: true
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.dnf:
    name:
      - rsyslog-gnutls
    state: present

- name: Save papertrail-bundle.pem
  become: true
  ansible.builtin.get_url:
    url: https://papertrailapp.com/tools/papertrail-bundle.pem
    dest: /etc/papertrail-bundle.pem
    mode: '0644'

- name: Setup rsyslog.conf
  ansible.builtin.blockinfile:
    path: /etc/rsyslog.conf
    block: |
      $DefaultNetstreamDriverCAFile /etc/papertrail-bundle.pem
      $ActionSendStreamDriver gtls
      $ActionSendStreamDriverMode 1
      $ActionSendStreamDriverAuthMode x509/name
      $ActionSendStreamDriverPermittedPeer *.papertrailapp.com

      *.*    @@{{ pre_rss_temple__papertrail_destination_host }}:{{ pre_rss_temple__papertrail_destination_port | int }}
    marker: '# {mark} ANSIBLE MANAGED BLOCK - Papertrail'
  become: true
  notify:
    - rsyslog changed

# Container logs go to journald, which rsyslog (configured above) already forwards to Papertrail
- name: Check for an existing Docker daemon config
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: _pre_rss_temple__docker_daemon_json_stat

- name: Read the existing Docker daemon config
  when: _pre_rss_temple__docker_daemon_json_stat.stat.exists
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: _pre_rss_temple__docker_daemon_json_slurp

# `log-opts` is replaced, not merged: options for another driver (eg `max-size`) would stop Docker from starting
- name: Log containers to journald
  ansible.builtin.copy:
    content: |
      {{ (_pre_rss_temple__docker_daemon_json_slurp.content | b64decode | from_json if _pre_rss_temple__docker_daemon_json_stat.stat.exists else {})
         | combine({'log-driver': 'journald', 'log-opts': {'tag': pre_rss_temple__docker_log_tag}})
         | to_nice_json }}
    dest: /etc/docker/daemon.json
    mode: '0644'
  become: true
  notify:
    - docker daemon changed
