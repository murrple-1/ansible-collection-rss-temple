---
- name: Check if '{{ rss_temple__app_postgres_user }}' Postgres User already exists
  ansible.builtin.command:
    chdir: '{{ _rss_temple__absolute_service_path }}'
    argv:
      - docker
      - compose
      - exec
      - -e
      - PGPASSWORD={{ _rss_temple__postgres_admin_password }}
      - '{{ rss_temple__app_docker_service_prefix }}postgresql'
      - psql
      - -U
      - '{{ rss_temple__postgres_admin_user }}'
      - --tuples-only
      - --no-align
      - -c
      - "SELECT 1 FROM pg_roles WHERE rolname='{{ rss_temple__app_postgres_user }}'"
      - '{{ rss_temple__postgres_name }}'
  become: true
  changed_when: false
  register: _rss_temple__django_user_exists_ret
  # `docker-compose.yml` files from earlier versions have no healthcheck to wait on (existing files aren't overwritten)
  until: _rss_temple__django_user_exists_ret.rc == 0
  retries: 10
  delay: 3

- ansible.builtin.set_fact:
    _rss_temple__django_user_exists: "{{ _rss_temple__django_user_exists_ret.stdout | trim == '1' }}"

# A single `-c` runs as one implicit transaction, so a failure part-way leaves no half-configured user behind
# (which the exists-check above would otherwise skip over on the next run)
- name: Create and configure '{{ rss_temple__app_postgres_user }}' Postgres User
  ansible.builtin.command:
    chdir: '{{ _rss_temple__absolute_service_path }}'
    argv:
      - docker
      - compose
      - exec
      - -e
      - PGPASSWORD={{ _rss_temple__postgres_admin_password }}
      - '{{ rss_temple__app_docker_service_prefix }}postgresql'
      - psql
      - -U
      - '{{ rss_temple__postgres_admin_user }}'
      - -c
      - |
        CREATE USER {{ rss_temple__app_postgres_user }} WITH PASSWORD '{{ _rss_temple__app_postgres_password | replace("'", "''") }}';
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO {{ rss_temple__app_postgres_user }};
        GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO {{ rss_temple__app_postgres_user }};
        GRANT ALL ON SCHEMA public TO {{ rss_temple__app_postgres_user }};
        -- Django-specific role settings (https://docs.djangoproject.com/en/stable/ref/databases/#optimizing-postgresql-s-configuration)
        ALTER ROLE {{ rss_temple__app_postgres_user }} SET client_encoding TO 'utf8';
        ALTER ROLE {{ rss_temple__app_postgres_user }} SET default_transaction_isolation TO 'read committed';
        ALTER ROLE {{ rss_temple__app_postgres_user }} SET timezone TO 'UTC';
      - '{{ rss_temple__postgres_name }}'
  become: true
  changed_when: true
  when: not _rss_temple__django_user_exists
