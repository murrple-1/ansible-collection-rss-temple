---
- ansible.builtin.include_role:
    name: murrple_1.rss_temple.common
    tasks_from: extras_file
  vars:
    common__extras_var_prefix: rss_temple_home__
    common__extras_file_prefix: rss-temple-home-extras

- ansible.builtin.include_role:
    name: murrple_1.rss_temple.common
    tasks_from: service_dir
  vars:
    common__service_path: '{{ rss_temple_home__service_path }}'

- ansible.builtin.include_tasks: _absolute_service_path.yml

- ansible.builtin.include_tasks: setup_config.yml

- name: Docker Compose Up
  community.docker.docker_compose_v2:
    project_src: '{{ _rss_temple_home__absolute_service_path }}'
    pull: always
  become: true
